<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>AdminAI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--s1:#171c27;--s2:#1e2535;--bd:#2a3347;--acc:#f0a830;--ok:#3dd68c;--no:#e05555;--t1:#e8eaf0;--t2:#8892a4;--t3:#4a5568;--r:10px}
html,body{min-height:100%;background:var(--bg);font-family:'Inter',sans-serif;color:var(--t1);font-size:14px}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:14px}
.hdr{display:flex;align-items:center;gap:11px;padding-bottom:14px;border-bottom:1px solid var(--bd)}
.logo{width:34px;height:34px;background:var(--acc);border-radius:8px;display:grid;place-items:center;font-family:'JetBrains Mono';font-weight:700;font-size:13px;color:#0f1117;flex-shrink:0}
.hdr h1{font-size:17px;font-weight:600}.hdr p{font-size:11px;color:var(--t3);font-family:'JetBrains Mono'}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.ctitle{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:12px;font-family:'JetBrains Mono'}
.file-label{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 16px;border:2px dashed var(--bd);border-radius:var(--r);cursor:pointer;background:var(--s2);transition:border-color .2s;text-align:center;-webkit-tap-highlight-color:transparent}
.file-label:hover,.file-label:active{border-color:var(--acc)}
.file-label input[type=file]{display:none}
.file-ico{font-size:28px}.file-txt{font-weight:500;font-size:14px}.file-sub{font-size:11px;color:var(--t3);font-family:'JetBrains Mono'}
#status{font-size:13px;color:var(--t2);font-family:'JetBrains Mono';padding:11px 14px;background:var(--s2);border-radius:var(--r);border:1px solid var(--bd);min-height:40px;line-height:1.6;word-break:break-word}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{padding:9px 18px;border-radius:var(--r);border:none;cursor:pointer;font-family:'Inter';font-size:13px;font-weight:500;transition:.15s;-webkit-tap-highlight-color:transparent}
.bp{background:var(--acc);color:#0f1117}.bp:hover{opacity:.88}.bp:disabled{background:var(--bd);color:var(--t3);cursor:not-allowed}
.bs{background:var(--s2);color:var(--t1);border:1px solid var(--bd)}.bs:hover{background:var(--bd)}.bs:disabled{opacity:.4;cursor:not-allowed}
.bx{background:rgba(224,85,85,.15);color:var(--no);border:1px solid rgba(224,85,85,.3)}.bx:hover{background:rgba(224,85,85,.25)}
.prow{display:flex;align-items:center;gap:10px;margin-top:12px}
.pbar{flex:1;height:5px;background:var(--s2);border-radius:3px;overflow:hidden}
.pfill{height:100%;background:var(--acc);border-radius:3px;width:0%;transition:width .4s}
#prog{font-size:12px;color:var(--t2);font-family:'JetBrains Mono';white-space:nowrap;min-width:80px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px}
.sv{font-size:24px;font-weight:600;font-family:'JetBrains Mono'}.sl{font-size:11px;color:var(--t3);margin-top:2px}
.stat.a .sv{color:var(--acc)}.stat.g .sv{color:var(--ok)}.stat.r .sv{color:var(--no)}
.tbl-wrap{overflow-x:auto;max-height:400px;overflow-y:auto;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{position:sticky;top:0;z-index:2}
th{background:var(--s2);color:var(--t2);font-weight:500;font-family:'JetBrains Mono';font-size:10px;text-transform:uppercase;letter-spacing:.6px;padding:8px 12px;text-align:left;border-bottom:1px solid var(--bd)}
td{padding:8px 12px;border-bottom:1px solid rgba(42,51,71,.5);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.02)}
.ok-b{color:var(--ok);font-weight:600}.no-b{color:var(--t3)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="logo">A</div>
    <div><h1>AdminAI</h1><p>Enrichissement B2B · Claude API · Swiss data</p></div>
  </div>
  <div class="card">
    <div class="ctitle">1 · Fichier Excel</div>
    <label class="file-label">
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv"/>
      <div class="file-ico">📊</div>
      <div class="file-txt">Appuie pour sélectionner ton fichier</div>
      <div class="file-sub">.xlsx · .xls · .csv</div>
    </label>
  </div>
  <div id="status">En attente d'un fichier…</div>
  <div class="card">
    <div class="ctitle">2 · Lancement</div>
    <div class="btns">
      <button class="bp" id="btnStart" disabled>🔍 Enrichir</button>
      <button class="bx" id="btnStop">⛔ Stop</button>
      <button class="bs" id="btnExport" disabled>📥 Exporter Excel</button>
    </div>
    <div class="prow">
      <div class="pbar"><div class="pfill" id="pfill"></div></div>
      <span id="prog">—</span>
    </div>
  </div>
  <div class="stats">
    <div class="stat a"><div class="sv" id="sTotal">0</div><div class="sl">Total</div></div>
    <div class="stat g"><div class="sv" id="sOk">0</div><div class="sl">Enrichies ✓</div></div>
    <div class="stat r"><div class="sv" id="sEmpty">0</div><div class="sl">Vides ✗</div></div>
  </div>
  <div class="card">
    <div class="ctitle">Résultats en temps réel</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Entreprise</th><th>Site web</th><th>Téléphone</th><th>Email</th><th>Adresse</th><th>✓</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
