<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdminAI</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }

    h1, h2 {
      margin-top: 0;
    }

    p {
      color: #cbd5e1;
    }

    input[type="file"] {
      margin: 12px 0;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    button {
      background: #f59e0b;
      color: #111827;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 12px;
      white-space: pre-wrap;
      color: #e2e8f0;
    }

    #previewWrap {
      overflow-x: auto;
      max-width: 100%;
      border: 1px solid #334155;
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
      background: #1e293b;
    }

    th, td {
      border: 1px solid #334155;
      padding: 8px;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #334155;
      position: sticky;
      top: 0;
    }

    .ok {
      color: #22c55e;
      font-weight: bold;
    }

    .err {
      color: #f87171;
      font-weight: bold;
    }

    .muted {
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AdminAI</h1>
    <p>Charge un Excel, teste le Worker, enrichis les lignes, puis exporte le fichier.</p>

    <div class="card">
      <h2>1. Charger un fichier Excel</h2>
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" />
      <div id="fileInfo" class="muted">Aucun fichier chargé</div>
    </div>

    <div class="card">
      <h2>2. Actions</h2>
      <div class="row">
        <button id="testBtn">Tester le Worker</button>
        <button id="startBtn" disabled>Lancer l’enrichissement</button>
      </div>
      <div id="status">Prêt.</div>
    </div>

    <div class="card">
      <h2>3. Prévisualisation</h2>
      <div id="previewWrap">
        <div id="preview"></div>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
