<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADMINIA — Extraction données clients</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <h1>ADMINIA</h1>
    <p class="subtitle">Extraction maximale de données clients depuis vos fichiers Excel</p>

    <!-- Étape 1 : Chargement -->
    <section id="step-upload">
      <h2>1. Charger un fichier</h2>
      <label class="file-drop" for="fileInput">
        <span id="fileLabel">Cliquer ou déposer un fichier (.xlsx, .xls, .csv)</span>
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" />
      </label>
      <p id="fileInfo" class="muted"></p>
    </section>

    <!-- Étape 2 : Mapping colonnes -->
    <section id="step-mapping" style="display:none">
      <h2>2. Colonnes détectées</h2>
      <p class="hint">ADMINIA a détecté automatiquement les colonnes. Vérifiez et ajustez si nécessaire.</p>
      <div id="mappingGrid"></div>
      <div class="btn-row">
        <button id="extractBtn" class="btn primary">Extraire les données →</button>
      </div>
    </section>

    <!-- Étape 3 : Résultats extraction -->
    <section id="step-results" style="display:none">
      <h2>3. Données extraites</h2>
      <div id="stats" class="stats-bar"></div>
      <div id="fillRates"></div>
      <div id="preview"></div>
      <div class="btn-row">
        <button id="exportLocalBtn" class="btn secondary">Exporter Excel</button>
        <button id="enrichBtn" class="btn primary">Enrichir les données manquantes via IA →</button>
      </div>
    </section>

    <!-- Étape 4 : Enrichissement IA -->
    <section id="step-enrich" style="display:none">
      <h2>4. Enrichissement IA</h2>
      <div id="enrichStatus" class="status-box"></div>
    </section>

    <div id="status" class="status-box"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
